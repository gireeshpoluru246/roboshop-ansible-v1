- name: configure the mongodb server
  hosts: mongodb
  become: yes
  tasks:
  - name: print variables from group_vars
    debug:
      msg: "{{ app_name }}"

  - name: copy the mongodb repo
    copy:
      src: "mongo.repo"
      dest: "/etc/yum.repos.d/mongo.repo"
  
  - name: install mongodb server
    package:
      name: mongodb-org
      state: present