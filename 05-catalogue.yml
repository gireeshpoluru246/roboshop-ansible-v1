- name: configure catalouge service
  hosts: catalouge
  become: yes
  tasks: 
  - name: disable default nodejs
    command: dnf module disable nodejs -y

  - name: enable nodejs24
    command: dnf module enable nodejs:24 -y

  - name: install nodejs 
    dnf:
     name: nodejs
     state: present

  - name: create roboshop system user
    user:
      name: roboshop
      create_home: false # false -> it will not create /home/roboshop directory
      home: /app # For system user we create only one directory /app
      system: true # indicates the user is system user not normal user
      shell: /sbin/nologin # disable the login access for system user
      comment: "roboshop system user" # it is just comment
    
    # here deleting the existing directory 
    # if you cannot delete ansible will prompt directory already present
  - name: remove existing app directory
    file:
      path: /app
      state: absent

   # here deleting the existing directory 
    # if you cannot delete ansible will prompt directory already present
  - name: remove catalogue.zip
    file:
      path: /tmp/catalogue.zip
      state: absent

  - name: create app directory
    file:
      path: /app
      state: directory

  - name: download catalogue application
    get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
      dest: /tmp/catalogue.zip

  - name: unzip catalogue
    unarchive:
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes #remote_src : yes-> file already exist on system server
      # remote_src no -> ansible tries to unarchive the file from its server 

  - name: install dependencies
    community.general.npm:
      path: /app

   # Here we cannot use the copy because copy module just copy it.
   # Here use the template module so ansible can process placeholder copy to remote machine.
   # any developer can understand the it is not just copy. it can replace placeholder and copy to remote machine.
  - name: copy catalogue service
    template:
      src: catalogue.service.j2
      dest: /etc/systemd/system/catalogue.service

  - name: copy mongo repo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo

  - name: install mongodb client
    dnf:
      name: mongodb-mongosh
      state: present

    # loaded the products data into mongodb only once
  - name: check products loaded or not
    command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
    register: product_count

  - name: print product_count
    debug:
      msg: "{{ product_count }}"

  - name: load the products
    shell: mongosh --host "{{ mongodb_host }}" < /app/db/master-data.js
    when: product_count.stdout | int == 0 # Here covert using filter and comparing product_count.stdout == 0 

  - name: daemon reload
    systemd_service:
      daemon_reload: true

  - name: start and enable catalogue
    service:
      name: catalogue
      state: restarted
      enabled: yes