- name: create ec2 instance and route 53 records
  hosts: local
  connection: local
  vars:
   # ansible-playbook roboshop.yaml -e "instances=['mongodb', 'redis']"
    # ansible-playbook roboshop.yaml -e "action=delete"
  - instances: ["mongodb", "redis", "mysql", "rabbitmq"]
  - instance_shape: "t3.micro"
  - ami_id: "ami-0055977a6e828a4f4"
  - aws_region: us-east-1
  - domain_name: "expenses123.store"
  - action: create
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      instance_type: "{{ instance_shape }}"
      image_id: "{{ ami_id }}"
      security_groups:
      - "roboshop-common"
      - "roboshop-{{ item }}-sg"
      region: "{{ aws_region }}"
    loop: "{{ instances }}"
    when: action == "create"
    register: ec2_output

  - name: print ec2 instance output
    debug:
      msg: "{{ ec2_output }}"
  
  - name: create route53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}" # mongodb.expenses123.store
      type: "A"
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true # overrite the existing record
    loop: "{{ ec2_output.results }}"  
    when: action == "create"


  - name: delete route 53 record
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }}.{{ domain_name }}" # mongodb.expenses123.store
      type: "A"
      ttl: 1
    loop: "{{ instances }}" 
    when: action == "delete"
  
 
  - name: delete ec2 instances
    amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{ item }}"
      region: us-east-1
      wait: false # don't wait till deletion the instance
    loop: "{{ instances }}"
    when: action == "delete"   
 
  

